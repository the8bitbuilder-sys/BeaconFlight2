name: Build BeaconFlight
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      
uses: actions/checkout@v4
uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '25'
      cache: maven
run: mvn -B package
uses: actions/upload-artifact@v4
with:
  name: BeaconFlight-jar
  path: target/BeaconFlight-7.0.jar
